version: '3.8'

services:
  nptel-admin-portal:
    build:
      context: ./nptel-admin-portal
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_SECRET=supersecretchangeinproduction
    restart: unless-stopped

  student-application-app:
    build:
      context: ./src/student-application-app
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_SECRET_KEY=supersecretchangeinproduction
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=adminpassword
    volumes:
      - student_data:/app/uploads
    restart: unless-stopped

volumes:
  student_data:
