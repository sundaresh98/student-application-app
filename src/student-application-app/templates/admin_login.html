<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="form-shell">
        <section class="form-card" aria-labelledby="page-title">
            <div class="institute-name" aria-label="Indian Institute of Technology Kharagpur">
                <span lang="bn">ভারতীয় প্রযুক্তিবিদ্যা প্রতিষ্ঠান খড়গপুর</span>
                <span lang="hi">भारतीय प्रौद्योगिकी संस्थान खड़गपुर</span>
                <strong>INDIAN INSTITUTE OF TECHNOLOGY KHARAGPUR</strong>
            </div>
            <h1 id="page-title">Admin login</h1>
            <p class="intro">Sign in to view submitted applications.</p>

            {% if error %}
                <div class="errors" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" required autocomplete="username">

                <label for="password">Password</label>
                <input id="password" name="password" type="password" required autocomplete="current-password">

                <button type="submit">Sign in</button>
            </form>
        </section>
    </main>
</body>
</html>
